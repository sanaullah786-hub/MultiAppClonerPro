plugins {
    id 'com.android.application'
}

android {
    namespace 'com.multiappcloner.pro'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion = "29.0.13846066"

    defaultConfig {
        applicationId "com.multiappcloner.pro"
        minSdk rootProject.ext.minSdk
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 5
        versionName "3.0.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    signingConfigs {
        release {
            // Provided by CI secrets or local gradle.properties; the release build is unsigned when absent.
            def ksPath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (ksPath != null && new File(ksPath).exists()) {
                storeFile file(ksPath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false   // the virtual engine relies on reflection; do not shrink it
            if (System.getenv("RELEASE_KEYSTORE_PATH") != null) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        jniLibs { useLegacyPackaging true }
    }

    lint { abortOnError false }
}

dependencies {
    implementation project(':Bcore')
    implementation 'io.github.reandroid:ARSCLib:1.3.5'
}
